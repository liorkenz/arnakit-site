<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הצטרפות לכרטיס נאמנות — ארנקית</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#12141c; --ink-2:#1b1f2b; --paper:#f6f4ef; --muted:#9aa1b2; --mint:#49d6c4; --line:rgba(255,255,255,0.08); }
  *{box-sizing:border-box;}
  body{background:var(--ink); color:var(--paper); font-family:'Rubik',sans-serif; line-height:1.6; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .card{background:var(--ink-2); border:1px solid var(--line); border-radius:20px; padding:32px; max-width:420px; width:100%;}
  h1{font-family:'Frank Ruhl Libre',serif; font-size:24px; margin-bottom:8px;}
  p{color:#d8d6cf; font-size:14.5px; margin-bottom:20px;}
  a{color:var(--mint);}
  label{display:flex; align-items:flex-start; gap:8px; font-size:14px; color:var(--paper); margin-bottom:24px; cursor:pointer;}
  input[type=checkbox]{margin-top:3px;}
  button{width:100%; padding:14px; border-radius:100px; border:none; background:var(--mint); color:#0d1f1c; font-size:16px; font-weight:600; cursor:pointer;}
  button:disabled{opacity:0.6; cursor:not-allowed;}
  .qr-fallback{text-align:center;}
  .qr-fallback img{border-radius:12px; margin:16px 0;}
  .loading{color:var(--muted); text-align:center;}
</style>
</head>
<body>
<div class="card" id="app">
  <p class="loading">טוען…</p>
</div>

<script src="/join.js"></script>
</body>
</html>
