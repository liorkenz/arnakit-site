<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הצטרפות לכרטיס נאמנות — ארנקית</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#12141c; --ink-2:#1b1f2b; --paper:#f6f4ef; --muted:#9aa1b2; --mint:#49d6c4; --line:rgba(255,255,255,0.08); }
  *{box-sizing:border-box;}
  body{background:var(--ink); color:var(--paper); font-family:'Rubik',sans-serif; line-height:1.6; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .card{background:var(--ink-2); border:1px solid var(--line); border-radius:20px; padding:32px; max-width:420px; width:100%;}
  h1{font-family:'Frank Ruhl Libre',serif; font-size:24px; margin-bottom:8px;}
  p{color:#d8d6cf; font-size:14.5px; margin-bottom:20px;}
  a{color:var(--mint);}
  label{display:flex; align-items:flex-start; gap:8px; font-size:14px; color:var(--paper); margin-bottom:24px; cursor:pointer;}
  input[type=checkbox]{margin-top:3px;}
  button{width:100%; padding:14px; border-radius:100px; border:none; background:var(--mint); color:#0d1f1c; font-size:16px; font-weight:600; cursor:pointer;}
  button:disabled{opacity:0.6; cursor:not-allowed;}
  .qr-fallback{text-align:center;}
  .qr-fallback img{border-radius:12px; margin:16px 0;}
  .loading{color:var(--muted); text-align:center;}
</style>
</head>
<body>
<div class="card" id="app">
  <p class="loading">טוען…</p>
</div>

<script>
  const FUNCTIONS_BASE = 'https://swtdgghjpcvyhrdwggae.functions.supabase.co';
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  const app = document.getElementById('app');

  function detectPlatform() {
    const ua = navigator.userAgent || '';
    if (/iPhone|iPad|iPod/i.test(ua)) return 'ios';
    if (/Android/i.test(ua)) return 'android';
    return 'other';
  }

  function renderError(message) {
    app.innerHTML = `<h1>אופס</h1><p>${message}</p>`;
  }

  function renderConsent(brandName) {
    const platform = detectPlatform();
    const enrollUrl = `${FUNCTIONS_BASE}/enroll?slug=${encodeURIComponent(slug)}&confirm=1&platform=${platform}`;

    if (platform === 'other') {
      const qrTarget = `${FUNCTIONS_BASE}/enroll?slug=${encodeURIComponent(slug)}`;
      app.innerHTML = `
        <h1>${brandName}</h1>
        <p>סרקו את הקוד הזה מהטלפון כדי להוסיף את הכרטיס לארנק הדיגיטלי.</p>
        <div class="qr-fallback">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(qrTarget)}" width="240" height="240" alt="QR code">
        </div>`;
      return;
    }

    app.innerHTML = `
      <h1>${brandName}</h1>
      <p>אנחנו נשמור מספר טלפון/אימייל (אם תמסרו לעסק), מונה התווים שלכם, ומועדי הביקור — כדי להפעיל את כרטיס הנאמנות. פרטים מלאים ב<a href="/privacy.html" target="_blank">מדיניות הפרטיות</a>.</p>
      <label>
        <input type="checkbox" id="promo">
        <span>אני מעוניין/ת לקבל מ-${brandName} עדכונים על מבצעים והטבות (ניתן להסיר בכל עת מגב הכרטיס)</span>
      </label>
      <button id="submitBtn">הוסיפו לארנק הדיגיטלי</button>
    `;

    document.getElementById('submitBtn').addEventListener('click', () => {
      const promo = document.getElementById('promo').checked ? '1' : '0';
      window.location.href = `${enrollUrl}&promo=${promo}`;
    });
  }

  if (!slug) {
    renderError('קישור לא תקין — חסר מזהה עסק.');
  } else {
    fetch(`${FUNCTIONS_BASE}/enroll-info?slug=${encodeURIComponent(slug)}`)
      .then((r) => r.json())
      .then((data) => {
        if (data.error || !data.hasActiveCard) {
          renderError('העסק הזה לא נמצא או שאין לו כרטיס פעיל כרגע.');
          return;
        }
        renderConsent(data.brandName);
      })
      .catch(() => renderError('שגיאה בטעינת הנתונים. נסו שוב.'));
  }
</script>
</body>
</html>
